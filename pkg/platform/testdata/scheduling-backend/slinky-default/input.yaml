backend:
  name: slinky
workflow:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            name: nccl-all-reduce-runtime
            kind: TrainingRuntime
          trainer:
            numNodes: 2
  dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: nccl-all-reduce-runtime
    spec:
      mlPolicy:
        mpi:
          mpiImplementation: OpenMPI
          numProcPerNode: 4
        numNodes: 2
      template:
        spec:
          replicatedJobs:
          - name: node
            template:
              spec:
                template:
                  spec:
                    restartPolicy: OnFailure
                    containers:
                    - name: node
                      image: nvcr.io/nvidia/pytorch:25.01
          - name: launcher
            dependsOn:
            - name: node
              status: Ready
            template:
              spec:
                backoffLimit: 1
                podFailurePolicy:
                  rules:
                  - action: Ignore
                    onPodConditions:
                    - status: 'True'
                      type: DisruptionTarget
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                    - name: node
                      image: nvcr.io/nvidia/pytorch:25.01
