---
{{- /*
  nvcre-run-role holds every write the controller makes to a namespaced
  resource outside NVCRE's API group, plus pod log reads. A ClusterRole with
  no binding grants nothing: run-rolebinding.yaml binds it cluster-wide under
  rbac.scope: cluster, or once per rbac.runNamespaces entry under
  rbac.scope: namespaced, and nvcrectl binds it in the namespaces it runs in
  (ADR-092). None of these resources is listed: the controller reads each one
  by name. Maintained by hand: controller-gen runs with output:rbac:none.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "nvcre.labels" . | nindent 4 }}
  name: nvcre-run-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - update
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaimtemplates
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - resource.nvidia.com
  resources:
  - computedomains
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - trainer.kubeflow.org
  resources:
  - trainingruntimes
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - trainer.kubeflow.org
  resources:
  - trainjobs
  verbs:
  - create
  - delete
  - patch
  - update

- apiGroups:
  - kubeflow.org
  resources:
  - mpijobs
  verbs:
  - create
  - delete
  - patch
  - update

# Native Run:ai distributed training, read live when selected.
- apiGroups: [run.ai]
  resources: [distributedworkloads, trainingworkloads, inferenceworkloads, distributedinferenceworkloads]
  verbs: [get, create, update, patch, delete]
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - leaderworkerset.x-k8s.io
  resources:
  - leaderworkersets
  verbs:
  - create
  - delete
  - get
  - patch
  - update
